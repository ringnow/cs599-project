version: '3.8'

services:
  # ── Backend: FastAPI ────────────────────────────────────
  research-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cs599-research-agent
    ports:
      - "8000:8000"   # FastAPI
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./skills_library:/app/skills_library
      - ~/.cs599-agent:/root/.cs599-agent
      - ./research_outputs:/app/research_outputs
    restart: unless-stopped
    networks:
      - agent-network

  # ── Frontend: React + Vite dev server ─────────────────────────────────
  frontend:
    image: node:22-alpine
    container_name: cs599-frontend
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules  # anonymous volume to avoid overwriting
    command: sh -c "npm install && npx vite --host 0.0.0.0 --port 5173"
    depends_on:
      - research-agent
    networks:
      - agent-network
    profiles:
      - dev  # Only start with: docker compose --profile dev up

  # ── Ollama (local models, optional) ───────────────────────────────────
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: cs599-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama-data:/root/.ollama
  #   networks:
  #     - agent-network

networks:
  agent-network:
    driver: bridge

volumes:
  ollama-data:
